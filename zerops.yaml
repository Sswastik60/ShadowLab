# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json
zerops:
  # --------------------------------------------------------
  # 1. Main Unified Service 'app' (Node.js API + Frontend)
  # --------------------------------------------------------
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - |
          cd backend
          npm install
          cd ../frontend
          npm install
          npm run build
      deployFiles:
        - ./backend/src
        - ./backend/package.json
        - ./backend/node_modules
        - ./frontend/dist
      cache:
        - backend/node_modules
        - frontend/node_modules
    run:
      base: nodejs@20
      start: node backend/src/server.js
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: "3000"
        NODE_ENV: "production"
      healthCheck:
        httpGet:
          port: 3000
          path: /health
        failureTimeout: 30s
        execPeriod: 10s

  # --------------------------------------------------------
  # 2. Standalone Service 'frontend'
  # --------------------------------------------------------
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - |
          cd frontend
          npm install
          npm run build
      deployFiles:
        - ./frontend/dist/~
      cache:
        - frontend/node_modules
    run:
      base: nodejs@20
      start: npx --yes serve -s ./ -l 3000
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: /
        failureTimeout: 30s
        execPeriod: 10s
